# SPDX-License-Identifier: Apache-2.0
name: Publish GFTA6 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gfta6-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node 24 for validation (no npm install)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate game before publishing
        run: |
          node --check src/core.js
          node --check src/airwar.js
          node --check src/airwar-world.js
          node --check src/audio-player.js
          node --check src/soundtrack.js
          node --check src/audio-cues.js
          node --check vendor/vanillajs/chip-audio/index.js
          node --check src/aircombat.js
          node --check src/aircombat-view.js
          node --check vendor/vanillajs/missiles.js
          node --check vendor/vanillajs/cockpit-rig/index.js
          node --check src/navigation.js
          node --check src/escape.js
          node --check src/flight-view.js
          node --check src/vehicle.js
          node --check src/app.js
          node --check src/render.js
          node --check sw.js
          node --test tests/*.test.js
          node scripts/check-assets.mjs
      - name: Headless Chromium acceptance before publishing
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          "$CHROME_BIN" --version
          node scripts/browser-chromium-smoke.mjs
      - name: Upload deployment browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfta6-pages-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/headless/
          if-no-files-found: ignore
      - name: Stage only the static browser game
        run: |
          mkdir -p _site
          cp index.html sw.js _site/
          cp -R src assets vendor _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/vendor/vanillajs/motion2d.js
          test -f _site/src/vehicle.js
          test -f _site/src/escape.js
          test -f _site/src/flight-view.js
          test -f _site/src/navigation.js
          test -f _site/src/aircombat.js
          test -f _site/src/aircombat-view.js
          test -f _site/vendor/vanillajs/missiles.js
          test -f _site/vendor/vanillajs/math/index.js
          test -f _site/vendor/vanillajs/cockpit-rig/index.js
          test -f _site/src/airwar.js
          test -f _site/src/airwar-world.js
          test -f _site/vendor/vanillajs/cad-geometry/index.js
          test -f _site/vendor/vanillajs/world-vis/index.js
          test -f _site/vendor/vanillajs/tactics/index.js
          test -f _site/vendor/vanillajs/trajectory/index.js
          test -f _site/vendor/vanillajs/creator-interop/index.js
          test -f _site/src/soundtrack.js
          test -f _site/src/audio-player.js
          test -f _site/src/audio-cues.js
          test -f _site/vendor/vanillajs/chip-audio/index.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static game
        uses: actions/upload-pages-artifact@v4
        with:
          # A job retry runs within the same workflow run. Without a unique
          # artifact name, it creates multiple github-pages artifacts and the
          # deploy action rejects the ambiguous metadata.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Deploy GFTA6
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
