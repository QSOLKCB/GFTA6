name: Browser game CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check JavaScript
        run: node --check src/core.js && node --check src/airwar.js && node --check src/airwar-world.js && node --check src/audio-player.js && node --check src/soundtrack.js && node --check src/audio-cues.js && node --check vendor/vanillajs/chip-audio/index.js && node --check src/aircombat.js && node --check src/aircombat-view.js && node --check vendor/vanillajs/missiles.js && node --check vendor/vanillajs/cockpit-rig/index.js && node --check src/navigation.js && node --check src/escape.js && node --check src/flight-view.js && node --check src/vehicle.js && node --check src/app.js && node --check src/render.js && node --check vendor/vanillajs/motion2d.js && node --check sw.js
      - name: Deterministic game tests
        run: node --test tests/*.test.js
      - name: Verify offline assets and pin
        run: node scripts/check-assets.mjs
      - name: Headless Chromium browser acceptance
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          "$CHROME_BIN" --version
          node scripts/browser-chromium-smoke.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfta6-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/headless/
          if-no-files-found: ignore
