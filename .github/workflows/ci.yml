name: Browser game CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check JavaScript
        run: node --check src/core.js && node --check src/vehicle.js && node --check src/app.js && node --check src/render.js && node --check vendor/vanillajs/motion2d.js && node --check sw.js
      - name: Deterministic game tests
        run: node --test tests/*.test.js
      - name: Verify offline assets and pin
        run: node scripts/check-assets.mjs
