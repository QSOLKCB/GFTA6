<text x="1126" y="435" fill="#ffedc4" font-size="23" font-weight="900">TO DO THAT TODAY.</text>
<text x="1127" y="466" fill="#d6e6e9" font-size="17" font-weight="700">OBJECTIVE: TASK NEVER ASSIGNED</text>
