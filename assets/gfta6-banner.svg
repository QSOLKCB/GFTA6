<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">GFTA6 — Girlfriend Theft Auto VI: the internet is furious, you're just trying to find parking</title>
<desc id="desc">Original satirical arcade banner. A pink hatchback overloaded with shopping and flat-pack furniture drives through a sunset suburb while duelling outrage billboards argue in the distance. A mission alert orders the player to complete a task that was never assigned.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#142548"/><stop offset=".48" stop-color="#513164"/><stop offset="1" stop-color="#f07676"/></linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe4a4"/><stop offset=".53" stop-color="#ffac89"/><stop offset="1" stop-color="#f6668d"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#252d4e"/><stop offset="1" stop-color="#10172c"/></linearGradient>
  <linearGradient id="paint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fa78a0"/><stop offset=".52" stop-color="#e84078"/><stop offset="1" stop-color="#9b285c"/></linearGradient>
  <linearGradient id="titlepaint" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff9e5"/><stop offset=".48" stop-color="#fff9e5"/><stop offset=".49" stop-color="#ffd78e"/><stop offset="1" stop-color="#ff8e88"/></linearGradient>
  <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="4" cy="9" r="1" fill="#fff" opacity=".06"/><circle cx="22" cy="28" r="1" fill="#000" opacity=".10"/></pattern>
  <filter id="shadow" x="-20%" y="-40%" width="160%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#070a1c" flood-opacity=".65"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="20"/></filter>
  <clipPath id="shape"><rect x="6" y="6" width="1588" height="588" rx="24"/></clipPath>
</defs>
<g clip-path="url(#shape)">
<rect width="1600" height="600" fill="url(#sky)"/>
<rect width="1600" height="600" fill="url(#grain)"/>
<circle cx="1033" cy="184" r="169" fill="#ffb293" opacity=".18" filter="url(#glow)"/>
<circle cx="1033" cy="184" r="137" fill="url(#sun)" opacity=".88"/>
<g fill="#703657" opacity=".82">
<path d="M0 340v-85h68v-49h49v69h54v-100h72v122h45v-63h48v105z"/>
