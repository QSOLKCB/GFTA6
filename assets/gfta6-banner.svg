</g>
<!-- Boutique signs and competing fictional outrage channels -->
<g font-family="Arial,Helvetica,sans-serif">
<rect x="71" y="328" width="117" height="48" rx="7" fill="#fce6bc" stroke="#2b2743" stroke-width="6"/>
<text x="129" y="360" text-anchor="middle" font-size="23" font-weight="900" fill="#442d50">NAILS</text>
<rect x="211" y="316" width="97" height="49" rx="7" fill="#9ce8de" stroke="#2b2743" stroke-width="6"/>
