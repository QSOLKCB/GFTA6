<text x="86" y="23" font-size="13" font-weight="800" fill="#ffcca3" text-anchor="middle" letter-spacing="1">CHANNEL A</text>
<text x="86" y="52" font-size="21" font-weight="900" fill="white" text-anchor="middle">RUINED!</text>
</g>
<g transform="translate(1368 100) rotate(-4)">
<rect x="0" y="0" width="165" height="82" rx="10" fill="#263551" stroke="#8bded5" stroke-width="4"/>
<text x="82" y="23" font-size="13" font-weight="800" fill="#8bded5" text-anchor="middle" letter-spacing="1">CHANNEL B</text>
<text x="82" y="49" font-size="16" font-weight="900" fill="white" text-anchor="middle">YOU DON'T</text>
<text x="82" y="70" font-size="16" font-weight="900" fill="white" text-anchor="middle">GET IT!</text>
</g>
</g>
<!-- Title area -->
<g font-family="Arial Black,Arial,Helvetica,sans-serif" filter="url(#shadow)">
<rect x="76" y="38" width="362" height="37" rx="18" fill="#182e45" stroke="#ffcf82" stroke-width="2"/>
<text x="257" y="63" font-size="16" font-weight="900" letter-spacing="1.8" text-anchor="middle" fill="#ffdfad">100% UNOFFICIAL • 0% FREE TIME</text>
<text x="82" y="201" font-size="174" font-weight="1000" letter-spacing="-10" fill="#171b36" stroke="#171b36" stroke-width="21" stroke-linejoin="round">GFTA6</text>
<text x="82" y="201" font-size="174" font-weight="1000" letter-spacing="-10" fill="url(#titlepaint)" stroke="#fff4d3" stroke-width="2">GFTA6</text>
<text x="94" y="251" font-size="37" font-weight="900" letter-spacing="3.8" fill="#fff5d9">GIRLFRIEND THEFT AUTO VI™</text>
<text x="94" y="293" font-size="25" font-weight="700" fill="#aef3e4">THE INTERNET IS FURIOUS.</text>
<text x="94" y="323" font-size="25" font-weight="700" fill="white">YOU'RE JUST TRYING TO FIND PARKING.</text>
</g>
