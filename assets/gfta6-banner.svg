<text x="800" y="585" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="1.4" fill="#ffe5b7">NOBODY WINS THE CULTURE WAR. EVERYBODY GETS ANOTHER ERRAND.</text>
