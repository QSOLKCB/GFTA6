<!-- Mission popup: deliberately absurd no-quest-marker quest -->
<g filter="url(#shadow)" font-family="Arial,Helvetica,sans-serif">
<rect x="1092" y="305" width="443" height="228" rx="21" fill="#111e36" stroke="#ffd088" stroke-width="6"/>
